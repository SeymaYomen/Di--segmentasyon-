seed: 42
data:
  manifest: data/processed/cdpr/manifest.csv
  split_file: data/splits/cdpr.json
  image_size: [512, 512]
  num_workers: 0
  preprocessing:
    mode: clahe
    gamma: 1.0
model:
  name: unetplusplus
  encoder: resnet34
  encoder_weights: imagenet
training:
  epochs: 100
  batch_size: 4
  pano_ratio: 0.75
  learning_rate: 0.0001
  patience: 10
  threshold: 0.5
  checkpoint: checkpoints/cdpr_clahe_best.pth
results_dir: results/cdpr_clahe
conformal:
  alpha: 0.1
  max_pixels_per_image: 10000
