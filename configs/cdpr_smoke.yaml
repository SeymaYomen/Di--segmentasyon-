seed: 42
data:
  manifest: data/processed/cdpr/manifest.csv
  split_file: data/splits/cdpr.json
  image_size: [128, 128]
  num_workers: 0
  max_samples:
    train: 16
    validation: 4
    calibration: 4
    test: 4
  preprocessing:
    mode: clahe
    gamma: 1.0
model:
  name: unetplusplus
  encoder: resnet18
  encoder_weights: null
training:
  epochs: 1
  batch_size: 2
  pano_ratio: 0.75
  learning_rate: 0.001
  patience: 1
  threshold: 0.5
  checkpoint: checkpoints/cdpr_smoke.pth
results_dir: results/cdpr_smoke
conformal:
  alpha: 0.1
  max_pixels_per_image: 1000
